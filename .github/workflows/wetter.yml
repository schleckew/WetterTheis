name: Wetterdaten aktualisieren

# Dieser Workflow veröffentlicht die Seite (HTML und JS) auf GitHub Pages.
# Die Wetterdaten kommen live über den Cloudflare Worker. Zusätzlich läuft er einmal
# täglich nachts, um tagesmittel.json (Tagesmittel der Außentemperatur) neu zu erzeugen.
on:
  workflow_dispatch:           # manuell startbar im Reiter "Actions"
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"       # täglich 00:30 UTC (01:30/02:30 Ortszeit), der Vortag ist dann vollständig

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Seite bereitstellen
        run: |
          mkdir -p _site
          cp ./*.html _site/
          cp ./*.js _site/
          cp ./*.webmanifest _site/
          cp -r icons _site/

      # Klappt der Abruf nicht, bleibt die zuletzt veröffentlichte Datei erhalten
      - name: Tagesmittel erzeugen
        run: |
          node tools/tagesmittel.mjs _site/tagesmittel.json \
            || curl -fsS "https://schleckew.github.io/WetterTheis/tagesmittel.json" -o _site/tagesmittel.json \
            || echo "::warning::tagesmittel.json konnte weder erzeugt noch übernommen werden"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
