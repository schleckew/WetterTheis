name: Wetterdaten aktualisieren

# Dieser Workflow veröffentlicht nur noch die Seite (HTML und JS) auf GitHub Pages.
# Die Wetterdaten kommen live über den Cloudflare Worker, deshalb gibt es keinen
# zeitgesteuerten Abruf und kein Secret mehr.
on:
  workflow_dispatch:           # manuell startbar im Reiter "Actions"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Seite bereitstellen
        run: |
          mkdir -p _site
          cp ./*.html _site/
          cp ./*.js _site/
          cp ./*.webmanifest _site/
          cp -r icons _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
