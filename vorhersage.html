<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vorhersage Wincheringen-Mont</title>
<meta name="description" content="Wettervorhersage, DWD-Warnungen und Regenradar für Wincheringen-Mont">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#e7ece5; --surface:#f6f8f3; --surface2:#e9eee6; --track:#d6ddd3;
  --ink:#18231f; --ink2:#45544f; --mute:#75837e; --line:rgba(24,35,31,.12);
  --c-wind:#2a6296; --c-gust:#17406b; --c-rain:#2b57a8; --c-sun:#c98200; --c-press:#6a4c93; --c-hum:#1f7a62;
  --good:#2f8f3a; --warn:#d6a100; --serious:#d9692f; --crit:#c23a3a; --ext:#6a4c93;
  --hero:#3c7a68;
  --disp:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f1514; --surface:#172120; --surface2:#1e2a28; --track:#2b3a37;
    --ink:#eef3ef; --ink2:#b4c1bb; --mute:#80908a; --line:rgba(255,255,255,.1);
    --c-wind:#6fa8de; --c-gust:#9cc4ea; --c-rain:#6f9ae6; --c-sun:#e8b23a; --c-press:#a794d6; --c-hum:#4cc3a0;
  }
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:16px 14px 40px}
.disp{font-family:var(--disp)}
.tn{font-variant-numeric:tabular-nums}

.switch{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}
.switch a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;text-decoration:none;font-weight:700;font-size:15px;line-height:1.2;min-width:0}
.switch a svg{flex:none;width:36px;height:36px}
.switch a small{display:block;font-weight:500;font-size:12px;margin-top:2px}
@media (max-width:640px){.switch{gap:6px}.switch a{flex-direction:column;text-align:center;gap:5px;padding:10px 4px;font-size:13px;overflow-wrap:anywhere}.switch a svg{width:30px;height:30px}.switch a small{font-size:11px}}
@media (max-width:380px){.switch a small{display:none}}
@media (max-width:820px){.switch{grid-template-columns:repeat(2,1fr);gap:8px}.switch a{flex-direction:row;text-align:left;gap:10px;padding:10px 12px;font-size:14px;overflow-wrap:normal}.switch a svg{width:30px;height:30px}.switch a small{font-size:11.5px}}
@media (max-width:440px){.switch a{font-size:13px;gap:8px;padding:10px 9px}.switch a svg{width:26px;height:26px}}
.switch a{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.switch a small{color:var(--mute)}
.switch a[aria-current="page"]{background:var(--c-wind);border-color:transparent;color:#fff}
.switch a[aria-current="page"] small{color:rgba(255,255,255,.85)}
.switch a:focus-visible{outline:3px solid var(--c-sun);outline-offset:2px}
.hist{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none;color:#fff;background:var(--c-wind);align-self:center;white-space:nowrap}
.hist svg{width:16px;height:16px;flex:none}
.hist:hover{filter:brightness(1.1)}
.hist:focus-visible{outline:3px solid var(--c-sun);outline-offset:2px}
.widget{display:flex;justify-content:center;padding:10px;margin-bottom:12px;overflow:hidden}
.widget iframe{display:block;max-width:100%;border:0;border-radius:10px}
/* Kopf */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.top h1{font-family:var(--disp);font-weight:800;font-size:clamp(22px,4.5vw,30px);margin:0;letter-spacing:-.01em}
.top .sub{color:var(--ink2);font-size:14px}
.status{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.status.live i{background:var(--good)}
.status.old i{background:var(--warn)}
.stamp{color:var(--mute);font-size:13px;margin:-4px 0 12px}
.banner{display:none;margin:0 0 12px;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);color:var(--ink2);font-size:14px}
.banner.show{display:block}

/* Hero */
.hero{border-radius:20px;padding:22px 22px 20px;color:#fff;background:var(--hero);transition:background .6s ease;
  display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:end}
.hero .cond{font-size:15px;font-weight:600;opacity:.92;margin-bottom:2px}
.hero .temp{font-family:var(--disp);font-weight:800;font-size:clamp(72px,18vw,112px);line-height:.95;letter-spacing:-.03em}
.hero .temp small{font-size:.38em;font-weight:700;opacity:.8;margin-left:3px;letter-spacing:0}
.hero .feel{font-size:15px;opacity:.92;margin-top:8px}
.hero .side{text-align:right;font-size:14px;line-height:1.7;opacity:.95}
.hero .side b{font-family:var(--disp);font-size:20px;font-weight:700}
.range{grid-column:1/-1;margin-top:14px}
.range .rb{position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.28)}
.range .rb i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(0,0,0,.18)}
.range .rl{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;opacity:.92}

/* Raster & Karten */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card h2{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--ink2)}
.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}
@media (max-width:820px){.span4,.span6,.span8{grid-column:span 12}}
@media (min-width:821px) and (max-width:960px){.span4{grid-column:span 6}}
.big{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em}
.big small{font-size:.45em;font-weight:700;color:var(--mute);margin-left:3px;letter-spacing:0}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--ink2)}
.kv b{font-weight:600}
.bar{height:9px;border-radius:99px;background:var(--track);overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .6s ease}
.hint{font-size:12.5px;color:var(--mute)}

/* Wind */
.windbox{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.windbox svg{flex:none}
.windnums{flex:1;min-width:170px}
.windnums .row{margin-bottom:12px}
.windnums .row .t{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2)}
.windnums .row .t b{color:var(--ink);font-family:var(--disp);font-size:18px}

/* Pills */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface2)}
.chip i{width:8px;height:8px;border-radius:50%}
.uvscale{display:flex;gap:3px;margin:12px 0 10px}
.uvscale span{flex:1;height:8px;border-radius:3px;background:var(--track)}

/* Tabelle */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl thead th{border-top:0;color:var(--mute);font-weight:600;font-size:13px}
.tbl th:first-child,.tbl td:first-child{text-align:left;color:var(--ink2);font-weight:600}
.tbl td small{color:var(--mute);margin-left:4px}
.scroll{overflow-x:auto}

/* Konfiguration */
details.cfg{margin-top:20px}
details.cfg summary{cursor:pointer;color:var(--mute);font-size:13px}
.cfgbox{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.cfgbox input{flex:1;min-width:200px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px}
.cfgbox button{padding:9px 16px;border:0;border-radius:8px;background:var(--c-wind);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.cfgbox button:focus-visible,.cfgbox input:focus-visible,summary:focus-visible{outline:3px solid var(--c-sun);outline-offset:2px}
textarea#jsonIn{width:100%;margin-top:8px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:13px/1.35 ui-monospace,Consolas,monospace}
.cfgbox input[readonly]{font:12px ui-monospace,Consolas,monospace}
.cfgbox button.alt{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.steps{margin:8px 0 0;padding-left:20px;color:var(--ink2);font-size:14px}
footer{margin-top:22px;font-size:12.5px;color:var(--mute);display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="switch" aria-label="Ansicht wählen"><a href="instrumente.html"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4.5 24.5a12 12 0 1 1 23 0"/><path d="M9 11.5l1.4 1.4M16 7.8v2M23 11.5l-1.4 1.4" stroke-width="2"/><path d="M16 22.5l5.2-8" stroke-width="2.6"/><circle cx="16" cy="22.5" r="2.4" fill="currentColor" stroke="none"/></svg><span>Messinstrumente<small>Zeigerinstrumente</small></span></a><a href="index.html"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="17" width="5" height="9" rx="1.2" fill="currentColor" stroke="none"/><rect x="13.5" y="9" width="5" height="17" rx="1.2" fill="currentColor" stroke="none"/><rect x="22" y="13" width="5" height="13" rx="1.2" fill="currentColor" stroke="none"/><path d="M3.5 28.5h25" stroke-width="2"/></svg><span>Detaildaten<small>Alle Werte und Extremwerte</small></span></a><a href="statistik.html"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 4.5v23h23" stroke-width="2"/><path d="M9 21l5-6 4 3.5 7-9.5"/><circle cx="25" cy="9" r="1.6" fill="currentColor" stroke="none"/></svg><span>Statistik<small>Verlauf und Jahre</small></span></a><a href="vorhersage.html" aria-current="page"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="21.5" cy="10.5" r="4.2"/><path d="M21.5 2.8v1.6M29.2 10.5h-1.6M27 5l-1.1 1.1M16 5l1.1 1.1"/><path d="M9.5 27a5.2 5.2 0 0 1-.6-10.36A7 7 0 0 1 22.3 18h.2a4.5 4.5 0 0 1 0 9z"/></svg><span>Vorhersage<small>Warnungen, Radar</small></span></a></nav>
  <script>document.querySelectorAll(".switch a").forEach(function(a){if(location.search)a.href+=location.search})</script>

  <div class="top">
    <div>
      <h1>Vorhersage</h1>
      <div class="sub">Wincheringen-Mont · Vorhersage, Warnungen, Radar, Sonne und Mond</div>
    </div>
  </div>

  <div id="hourly"></div>

  <div id="warn"></div>
  <div id="outlook"></div>

  <footer>
    <span>Vorhersage: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · Warnungen und Radar: <a href="https://www.dwd.de/" target="_blank" rel="noopener">Deutscher Wetterdienst</a> (Warnungen über <a href="https://brightsky.dev/" target="_blank" rel="noopener">Brightsky</a>)</span>
  </footer>
</div>

  s.onerror=function(){var d=document.createElement("div");d.style.cssText="margin:12px;padding:10px 14px;border:1px solid #c23a3a;border-radius:10px;font:14px system-ui,sans-serif;color:#c23a3a;background:#fff";d.textContent="Vorhersage: ausblick.js konnte nicht geladen werden. Liegt die Datei im selben Ordner wie diese Seite?";document.body.appendChild(d)};
  document.body.appendChild(s);
})();
</script>
</body>
</html>
